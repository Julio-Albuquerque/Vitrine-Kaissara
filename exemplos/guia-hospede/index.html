<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}

.cover img{position:absolute;top:0;left:0}
.cover img,.gal img{width:100%;height:100%;object-fit:cover;display:block}
.cover img{position:absolute;top:0;left:0}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 6px}
.gal figure{margin:0;min-width:0}
.gal .ph{position:relative;height:0;padding-top:100%;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,var(--chip),var(--line))}
.gal figcaption{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.credit{display:block;margin-top:6px;font-size:11px;opacity:.8}

.rooms{display:flex;flex-direction:column;gap:14px;margin:4px 0 22px}
.rooms h2{font-family:var(--display);font-weight:800;font-size:24px;margin:6px 0 0}
.rooms .lead{margin:0;color:var(--muted)}
.room{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.room .ph{position:relative;height:0;padding-top:62.5%;max-width:100%;background:linear-gradient(160deg,var(--chip),var(--line))}
.room .ph img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.room .tx{padding:14px 16px 16px;min-width:0}
.room h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 6px}
.room p{margin:0 0 10px}
.room .items{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.room .items li{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px}

.pix{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--chip);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.pix small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pix code{font:700 15px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.pix .copy{background:var(--sea);color:var(--sea-ink)}
.note{margin:12px 0 0;font-size:14px;color:var(--muted)}

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: uma coluna estreita como um app de celular; cabeçalho com idioma fixo no topo, seções em blocos que o hóspede abre */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --fg:#0f2a2e; --muted:#51696c; --line:#d6e1df;
  --sea:#0c5d63; --sea-ink:#ffffff; --sun:#f2b632; --chip:#e3efed;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1a1c; --surface:#122629; --fg:#e6f0ee; --muted:#9db3b2; --line:#24403f;
  --sea:#5fc1c4; --sea-ink:#06292c; --sun:#f2c14e; --chip:#183337; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1a1c; --surface:#122629; --fg:#e6f0ee; --muted:#9db3b2; --line:#24403f;
  --sea:#5fc1c4; --sea-ink:#06292c; --sun:#f2c14e; --chip:#183337; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sea)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.demo{background:var(--sun);color:#2a2000;font-size:13px;text-align:center;padding:6px 16px;font-weight:700}
header.top{position:-webkit-sticky;position:sticky;top:0;z-index:5;background:var(--sea);color:var(--sea-ink)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.2px}
.langs{display:flex;gap:4px}
.langs button{font:700 13px var(--body);border:1px solid currentColor;background:transparent;color:var(--sea-ink);border-radius:999px;padding:4px 10px;cursor:pointer;opacity:.75}
.langs button[aria-pressed="true"]{background:var(--sea-ink);color:var(--sea);opacity:1}
.langs button:focus-visible,.card summary:focus-visible,.copy:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{padding-block:22px 6px}
.hero h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1;margin:0 0 6px}
.hero p{margin:0;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wifi{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sea);color:var(--sea-ink);border-radius:14px;padding:14px 16px;margin:12px 0 18px;flex-wrap:wrap}
.wifi small{display:block;opacity:.8;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.wifi code{font:700 17px ui-monospace,Menlo,Consolas,monospace}
.copy{font:700 14px var(--body);background:var(--sea-ink);color:var(--sea);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--display);font-weight:600;font-size:18px}
.card summary::-webkit-details-marker{display:none}
.card summary::after{content:"+";font-size:22px;color:var(--sea)}
.card[open] summary::after{content:"–"}
.card .in{padding:0 16px 16px;min-width:0}
.card ul,.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;background:var(--chip);color:var(--fg);font-size:12px;border-radius:999px;padding:2px 8px;margin-left:6px}
.sos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sos div{background:var(--chip);border-radius:10px;padding:10px;text-align:center}
.sos b{display:block;font-family:var(--display);font-size:24px}
.sos span{font-size:13px;color:var(--muted)}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:380px){.facts{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  </div>

  <footer><span data-t="foot"></span><span class="credit" data-t="cred"></span></footer>
</main>

let lang="pt";
function render(){
  const t=T[lang]; document.documentElement.lang=lang==="pt"?"pt-BR":lang;
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=t[e.dataset.t]});
  document.querySelectorAll("[data-l-list]").forEach(e=>{e.innerHTML="";t[e.dataset.lList].forEach(x=>{const li=document.createElement("li");li.textContent=x;e.appendChild(li)})});
  const b=document.getElementById("beaches"); b.innerHTML="";
  BEACH[lang].forEach(([n,w,g])=>{const r=document.createElement("div");r.className="row";r.innerHTML=`<span><b></b><span class="tag"></span></span><span></span>`;r.querySelector("b").textContent=n;r.querySelector(".tag").textContent=w;r.lastChild.textContent=g;b.appendChild(r)});
  const R=document.getElementById("rooms"); R.innerHTML="";
  ROOMS.forEach(r=>{const c=r.t[lang];const a=document.createElement("article");a.className="room";
    a.innerHTML=(r.img?'<div class="ph"><img loading="lazy" onerror="this.remove()"></div>':'')+'<div class="tx"><h3></h3><p></p><ul class="items"></ul></div>';
    if(r.img){const im=a.querySelector("img");im.src=r.img;im.alt=r.alt;}
    a.querySelector("h3").textContent=c.t;a.querySelector("p").textContent=c.d;
    c.i.forEach(x=>{const li=document.createElement("li");li.textContent=x;a.querySelector(".items").appendChild(li)});
    R.appendChild(a)});
  document.querySelectorAll(".langs button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.l===lang));
}
document.querySelectorAll(".langs button").forEach(x=>x.addEventListener("click",()=>{lang=x.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){};render()}));
try{const s=localStorage.getItem("lang");if(s&&T[s])lang=s}catch(e){}
